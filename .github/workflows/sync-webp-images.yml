# .github/workflows/sync-webp-images.yml
# Ensures all WebP files are up-to-date with their PNG sources
# Runs automatically on PNG changes OR manually on-demand

name: Sync WebP Images

on:
  # Automatic: Trigger when PNG files change
  push:
    branches: [ main, test, Forte-Master ]  # Added Forte-Master
    paths:
      - 'img/**/*.png'
      - 'convert-to-webp.js'
      - 'update-card-data-webp.js'
      - 'rebuild-on-push.js'

  # Manual: Allow running from Actions tab (works on ANY branch)
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all WebP files (ignore timestamps)'
        required: false
        type: boolean
        default: false

jobs:
  sync-webp:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history for timestamp comparison

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install Sharp for Image Conversion
        run: npm install sharp --no-save

      - name: Check if Scripts Exist
        run: |
          echo "Checking for required scripts..."
          ls -la convert-to-webp.js || echo "⚠️ convert-to-webp.js not found"
          ls -la update-card-data-webp.js || echo "⚠️ update-card-data-webp.js not found"
          ls -la rebuild-on-push.js || echo "⚠️ rebuild-on-push.js not found"

      - name: Verify WebP Sync Status
        id: verify
        run: |
          echo "🔍 Checking WebP file status..."
          
          # Count PNG and WebP files
          PNG_COUNT=$(find img/approved -type f -name "*.png" 2>/dev/null | wc -l)
          WEBP_COUNT=$(find img/approved -type f -name "*.webp" 2>/dev/null | wc -l)
          
          echo "📊 Found $PNG_COUNT PNG files and $WEBP_COUNT WebP files"
          echo "png_count=$PNG_COUNT" >> $GITHUB_OUTPUT
          echo "webp_count=$WEBP_COUNT" >> $GITHUB_OUTPUT
          
          # Always run conversion to ensure sync
          echo "needs_update=true" >> $GITHUB_OUTPUT

      - name: Convert PNG to WebP
        run: |
          echo "🎨 Starting WebP conversion..."
          
          if [ "${{ github.event.inputs.force_rebuild }}" == "true" ]; then
            echo "⚠️  Force rebuild enabled - recreating ALL WebP files"
            find img/approved -type f -name "*.webp" -delete 2>/dev/null || true
          fi
          
          if [ -f "convert-to-webp.js" ]; then
            node convert-to-webp.js
          else
            echo "⚠️ convert-to-webp.js not found, skipping conversion"
          fi
          
          NEW_WEBP_COUNT=$(find img/approved -type f -name "*.webp" 2>/dev/null | wc -l)
          echo "✅ WebP conversion complete - $NEW_WEBP_COUNT total files"

      - name: Update Card Data
        run: |
          echo "📝 Updating card data with WebP URLs..."
          if [ -f "update-card-data-webp.js" ]; then
            node update-card-data-webp.js || echo "⚠️ Card data update failed, continuing..."
          else
            echo "⚠️ update-card-data-webp.js not found, skipping"
          fi

      - name: Rebuild Image Data
        run: |
          echo "🔨 Rebuilding image_data.js..."
          if [ -f "generate_image_structure.js" ]; then
            npm run build:images || echo "⚠️ Build failed, continuing..."
          else
            echo "⚠️ generate_image_structure.js not found, skipping"
          fi

      - name: Generate Sync Report
        run: |
          echo "📊 Sync Report"
          echo "=============="
          echo "PNG files: ${{ steps.verify.outputs.png_count }}"
          FINAL_WEBP=$(find img/approved -type f -name "*.webp" 2>/dev/null | wc -l)
          echo "WebP files: $FINAL_WEBP"
          echo "✅ Sync complete!"

      - name: Commit Updated Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-sync: WebP images, card data, and image_data.js [skip ci]"
          file_pattern: |
            img/**/*.webp
            data/cards.json
            image_data.js
          commit_user_name: GitHub Action Bot
          commit_user_email: actions@github.com
          commit_author: GitHub Action Bot <actions@github.com>
          skip_dirty_check: false

