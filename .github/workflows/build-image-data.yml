# .github/workflows/build-image-data.yml

name: Build Image Data

# Controls when the workflow will run
on:
  # Triggers the workflow on push events
  push:
    branches: [ main, test, Forte-Master ] # Support all branches
    paths: # Only run if relevant files change
      - 'img/**'
      - 'filter_config.json'
      - 'generate_image_structure.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-image-data.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Sets up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your desired Node.js version
          cache: 'npm' # or 'pnpm' if you use pnpm

      # Installs dependencies (good practice, even if not strictly needed for this script)
      - name: Install Dependencies
        run: npm install # Use 'pnpm install' if you initialized with pnpm

      # Install sharp for WebP conversion
      - name: Install Sharp for WebP Conversion
        run: npm install sharp --save-dev

      # Auto-detect PNG changes and rebuild everything
      - name: Auto-Rebuild on PNG Changes
        run: |
          echo "🔍 Detecting PNG changes and triggering automatic rebuilds..."
          node rebuild-on-push.js
          echo "✅ Auto-rebuild complete!"

      # Commit changes (WebP images, card data, and image_data.js)
      - name: Commit updated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto: Converted PNG→WebP, updated card data & image_data.js"
          file_pattern: |
            img/**/*.webp
            data/cards.json
            image_data.js
          commit_user_name: GitHub Action Bot
          commit_user_email: actions@github.com
          commit_author: GitHub Action Bot <actions@github.com>
          push_options: '--force-with-lease'
