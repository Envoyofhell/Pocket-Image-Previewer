# .github/workflows/build-image-data.yml

name: Build Image Data

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the main branch
  push:
    branches: [ main ] # Adjust branch name if needed (e.g., master)
    paths: # Only run if relevant files change (optional but recommended)
      - 'img/**'
      - 'filter_config.json'
      - 'generate_image_structure.js'
      - 'package.json'
      - 'package-lock.json' # or 'pnpm-lock.yaml' if using pnpm
      - '.github/workflows/build-image-data.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Sets up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your desired Node.js version
          cache: 'npm' # or 'pnpm' if you use pnpm

      # Installs dependencies (good practice, even if not strictly needed for this script)
      - name: Install Dependencies
        run: npm install # Use 'pnpm install' if you initialized with pnpm

      # Convert PNGs to WebP
      - name: Convert PNG to WebP
        run: |
          echo "🎨 Converting PNG images to WebP..."
          # Find all PNG files that don't have a corresponding WebP
          find img/approved -type f -name "*.png" | while read png_file; do
            webp_file="${png_file%.png}.webp"
            # Only convert if WebP doesn't exist or PNG is newer
            if [ ! -f "$webp_file" ] || [ "$png_file" -nt "$webp_file" ]; then
              echo "Converting: $png_file"
              npx @squoosh/cli --webp '{"quality":85}' -d "$(dirname "$png_file")" "$png_file"
              # Rename output to .webp (squoosh may create different name)
              if [ -f "${png_file%.png}.webp" ]; then
                echo "✅ Created: $webp_file"
              fi
            else
              echo "⏭️  Skipped: $webp_file (already exists)"
            fi
          done
          echo "✨ WebP conversion complete!"

      # Update card data with WebP URLs
      - name: Update Card Data with WebP URLs
        run: |
          echo "📝 Updating card data JSON files with WebP URLs..."
          node update-card-data-webp.js
          echo "✅ Card data updated!"

      # Runs the build script defined in package.json
      - name: Run Build Script
        run: npm run build:images # This executes 'node generate_image_structure.js'

      # Commit changes (images, card data, and image_data.js)
      - name: Commit updated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Update images (WebP), card data, and image_data.js"
          file_pattern: |
            img/**/*.webp
            data/*.json
            image_data.js
          commit_user_name: GitHub Action Bot
          commit_user_email: actions@github.com
          commit_author: GitHub Action Bot <actions@github.com>
